<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="Smaller and faster: the trade-off that disappeared"><style>.ttl{font:600 17px system-ui, -apple-system, "Segoe UI", sans-serif}.sub{font:400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif}.lbl{font:400 12px system-ui, -apple-system, "Segoe UI", sans-serif}.tick{font:400 11px system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.val{font:600 12px system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.note{font:400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ttl{fill:#ffffff}.sub{fill:#c3c2b7}.lbl{fill:#c3c2b7}.tick{fill:#898781}.val{fill:#ffffff}.note{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.s1{fill:#3987e5}.s2{fill:#d95926}}</style><g><rect class="bg" width="880" height="480" fill="#fcfcfb"/><text class="ttl" x="74" y="32" fill="#0b0b0b">Smaller and faster: the trade-off that disappeared</text><text class="sub" x="74" y="53" fill="#52514e">Llama-3.2-3B on Neoverse N2, prefill pp512, same runner</text><text class="tick" x="74" y="66" fill="#898781">t/s</text><line class="grid" x1="74" y1="374.0" x2="680" y2="374.0" stroke="#e1e0d9" stroke-width="1"/><text class="tick" x="65" y="378.0" text-anchor="end" fill="#898781">0</text><line class="grid" x1="74" y1="300.0" x2="680" y2="300.0" stroke="#e1e0d9" stroke-width="1"/><text class="tick" x="65" y="304.0" text-anchor="end" fill="#898781">16</text><line class="grid" x1="74" y1="226.0" x2="680" y2="226.0" stroke="#e1e0d9" stroke-width="1"/><text class="tick" x="65" y="230.0" text-anchor="end" fill="#898781">32</text><line class="grid" x1="74" y1="152.0" x2="680" y2="152.0" stroke="#e1e0d9" stroke-width="1"/><text class="tick" x="65" y="156.0" text-anchor="end" fill="#898781">48</text><line class="grid" x1="74" y1="78.0" x2="680" y2="78.0" stroke="#e1e0d9" stroke-width="1"/><text class="tick" x="65" y="82.0" text-anchor="end" fill="#898781">64</text><line class="axis" x1="74" y1="374.0" x2="680" y2="374.0" stroke="#c3c2b7" stroke-width="1"/><text class="tick" x="231.3" y="394.0" text-anchor="middle" fill="#898781">1.70</text><text class="tick" x="505.3" y="394.0" text-anchor="middle" fill="#898781">1.87</text><text class="lbl" x="377.0" y="418.0" text-anchor="middle" fill="#52514e">file size on disk and in RAM (GiB) — smaller is better</text><line class="axis" x1="74" y1="178.0" x2="680" y2="178.0" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 5"/><line class="axis" x1="506.0" y1="78" x2="506.0" y2="374.0" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 5"/><line class="axis" x1="231.6" y1="244.4" x2="231.6" y2="146.4" stroke="#eb6834" stroke-width="2.5"/><path d="M231.6,144.4 l-6,-11 l12,0 Z" fill="#eb6834" class="s2"/><text class="val" x="245.6" y="199.4" fill="#0b0b0b">  2.12x</text><circle cx="231.6" cy="259.4" r="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="3" class=""/><text class="val" x="248.6" y="257.4" fill="#0b0b0b">IQ4_XS, stock</text><text class="lbl" x="248.6" y="275.4" fill="#52514e">1.70 GiB · 25.0 t/s</text><circle cx="506.0" cy="178.0" r="9" fill="#2a78d6" stroke="#2a78d6" stroke-width="3" class="s1"/><text class="val" x="523.0" y="176.0" fill="#0b0b0b">Q4_K_M</text><text class="lbl" x="523.0" y="194.0" fill="#52514e">1.87 GiB · 42.7 t/s · untouched</text><circle cx="231.6" cy="131.4" r="9" fill="#eb6834" stroke="#eb6834" stroke-width="3" class="s2"/><text class="val" x="248.6" y="129.4" fill="#0b0b0b">IQ4_XS, FastPath64</text><text class="lbl" x="248.6" y="147.4" fill="#52514e">1.70 GiB · 52.9 t/s</text><text class="note" x="74" y="450" fill="#898781">IQ4_XS was 9% smaller and ran at 0.58x the prefill of Q4_K_M: fitting the instance cost throughput.</text><text class="note" x="74" y="464" fill="#898781">It is now 1.24x — above and to the left of the format it replaces, so the choice costs nothing.</text></g></svg>